# Boards Twister can flash and test. Twister passes `id` to the runner as its
# device argument (--dev-id for nrfutil, --esp-device for esp32, ...).
# Generate your own with: west twister --generate-hardware-map map.yaml
# Uncomment the board that is plugged in.

# ======= nRF5340dk =======
- connected: true
  id: '1050073602'
  platform: nrf5340dk/nrf5340/cpuapp
  product: J-Link
  runner: nrfutil
  serial: /dev/ttyACM1

