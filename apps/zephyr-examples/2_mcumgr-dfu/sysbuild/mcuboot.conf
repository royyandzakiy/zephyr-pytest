# Both required for MCUboot to boot on the nRF5340 with vanilla Zephyr v4.4.
# Without them, MCUboot faults before its console is up and the board stays silent.

# Enables the kernel's threads, which sets up thread-local storage.
# picolibc keeps errno in thread-local storage, so any errno write needs it.
CONFIG_MULTITHREADING=y

# Enables a malloc heap for libc (default 0, no heap).
# Required for PSA crypto, which allocates memory while checking the RSA image signature.
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=16384

# Prints the swap type and upgrade progress at boot.
CONFIG_MCUBOOT_LOG_LEVEL_INF=y
