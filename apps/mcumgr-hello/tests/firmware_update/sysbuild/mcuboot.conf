# Extra Kconfig for the MCUboot image. Sysbuild merges this file into MCUboot's
# own prj.conf (it does not replace it, unlike a sysbuild/mcuboot/prj.conf).

# Workaround for vanilla Zephyr v4.4 MCUboot on the nRF5340 DK, which BusFaults
# before the console is up and leaves the board completely silent.
# zephyr/samples/sysbuild/with_mcuboot crashes the same way.
#
# The chain: MCUboot runs with CONFIG_MULTITHREADING=n, so the thread-local
# storage pointer is never set, but picolibc keeps errno in TLS. The RSA check
# goes through PSA crypto, which calls calloc; with a malloc arena of 0 that
# fails and writes errno through the null TLS pointer, to address 0x8 (flash).

CONFIG_MULTITHREADING=y
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=16384

# MCUboot prints the swap type and progress at INFO, handy when reading logs.
CONFIG_MCUBOOT_LOG_LEVEL_INF=y
