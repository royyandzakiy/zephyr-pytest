# Activate C++
CONFIG_CPP=y
CONFIG_STD_CPP2B=y
CONFIG_GLIBCXX_LIBCPP=y

# Increase main stack size
CONFIG_MAIN_STACK_SIZE=2048

## ------ MCUmgr over the shell ------- ##
# Taken from zephyr/tests/boot/with_mcumgr. The SMP frames travel inside the
# shell on the same UART, so the shell fixture and the mcumgr fixture can both
# use /dev/ttyACM1 (just not at the same time).
CONFIG_NET_BUF=y
CONFIG_ZCBOR=y
CONFIG_CRC=y
CONFIG_BASE64=y
CONFIG_MCUMGR=y
CONFIG_MCUMGR_TRANSPORT_SHELL=y
CONFIG_MCUMGR_GRP_IMG=y
CONFIG_MCUMGR_GRP_OS=y

CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_STREAM_FLASH=y
CONFIG_IMG_MANAGER=y

CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_SHELL_VT100_COLORS=n
# adds the `mcuboot` shell command, handy to see both slots by hand
CONFIG_MCUBOOT_SHELL=y

# No logging subsystem here on purpose. printk then goes straight to the UART,
# so "Hello World!" is not held back by the deferred log thread, and nothing
# log-shaped ends up inside the channel the mcumgr CLI is reading.
CONFIG_LOG=n
